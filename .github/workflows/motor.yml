name: Motor Control ORAMI

on:
  workflow_dispatch: {}       # lo dispara cron-job.org (cada 15 min) y se puede correr a mano

concurrency:
  group: motor               # candado: solo una corrida a la vez (protege el cierre mensual)
  cancel-in-progress: true   # si una corrida se cuelga, la siguiente la reemplaza en vez de
                             # formarse detras (evita la cascada de cancelaciones = "Run failed")

jobs:
  motor:
    runs-on: ubuntu-latest
    timeout-minutes: 5          # tope duro: si una corrida se cuelga (correo sin responder),
                                # se corta a los 5 min y libera el candado (evita cancelaciones
                                # en cadena). La siguiente corrida hace el trabajo normalmente.
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Instalar dependencias
        run: pip install -r requirements.txt
      - name: Correr el motor
        env:
          IMAP_HOST: mail.nacionalissimo.com
          IMAP_PORT: '993'
          IMAP_USER: ${{ secrets.IMAP_USER }}
          IMAP_PASS: ${{ secrets.IMAP_PASS }}
          FIREBASE_SA: ${{ secrets.FIREBASE_SA }}
        run: python motor.py
